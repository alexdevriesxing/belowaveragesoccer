name: FMCG marketplace app build farm

on:
  push:
    branches:
      - ci/fmcg-marketplace-build
    paths:
      - "apps/marketplace-margin-calculator/**"
      - ".github/workflows/fmcg-marketplace-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Shared calculator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic margin tests
        run: node apps/marketplace-margin-calculator/tests/calculator.test.cjs
      - name: Validate branded web app assets
        run: |
          grep -q "FMCG by Alex" apps/marketplace-margin-calculator/web/index.html
          grep -q "Kalkulator Margin Marketplace Indonesia" apps/marketplace-margin-calculator/web/app.js
          grep -q "__FMCG_APP_SMOKE__" apps/marketplace-margin-calculator/web/app.js

  windows:
    name: Windows x64 installer + executable smoke test
    needs: core
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/marketplace-margin-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate FMCG by Alex application icons
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.fmcgbyalex.com/brand/fmcg-by-alex-logo.jpg" -OutFile "app-icon.jpg"
          npx --yes @tauri-apps/cli@2 icon app-icon.jpg
      - name: Build Windows NSIS installer
        shell: pwsh
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Smoke-test compiled application binary
        shell: pwsh
        run: |
          & ".\src-tauri\target\release\fmcg-marketplace-margin.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          $installer = Get-ChildItem ".\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer generated" }
          Copy-Item $installer.FullName ".\out\FMCG-by-Alex-Marketplace-Margin-Calculator-Windows-x64.exe"
          Get-FileHash ".\out\FMCG-by-Alex-Marketplace-Margin-Calculator-Windows-x64.exe" -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: fmcg-margin-windows
          path: apps/marketplace-margin-calculator/out/FMCG-by-Alex-Marketplace-Margin-Calculator-Windows-x64.exe
          if-no-files-found: error

  macos:
    name: macOS universal DMG + binary smoke test
    needs: core
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/marketplace-margin-calculator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Generate FMCG by Alex application icons
        run: |
          curl -fL "https://www.fmcgbyalex.com/brand/fmcg-by-alex-logo.jpg" -o app-icon.jpg
          npx --yes @tauri-apps/cli@2 icon app-icon.jpg
      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
      - name: Mount DMG and smoke-test packaged universal application
        run: |
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          MOUNT_DIR="$(mktemp -d /tmp/fmcg-margin.XXXXXX)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          BIN="$(find "$MOUNT_DIR" -type f -path '*.app/Contents/MacOS/fmcg-marketplace-margin' | head -n 1)"
          test -n "$BIN"
          lipo -info "$BIN" | tee /tmp/fmcg-lipo.txt
          grep -q "x86_64" /tmp/fmcg-lipo.txt
          grep -q "arm64" /tmp/fmcg-lipo.txt
          codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$BIN")")")"
          "$BIN" --smoke-test
          hdiutil detach "$MOUNT_DIR"
      - name: Stage DMG
        run: |
          mkdir -p out
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          cp "$DMG" "out/FMCG-by-Alex-Marketplace-Margin-Calculator-macOS-universal.dmg"
          shasum -a 256 "out/FMCG-by-Alex-Marketplace-Margin-Calculator-macOS-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: fmcg-margin-macos
          path: apps/marketplace-margin-calculator/out/FMCG-by-Alex-Marketplace-Margin-Calculator-macOS-universal.dmg
          if-no-files-found: error

  android:
    name: Android APK + emulator install/runtime test
    needs: core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketplace-margin-calculator/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Install and runtime-test in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apps/marketplace-margin-calculator/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.fmcgbyalex.marketplacemargin/.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -q "com.fmcgbyalex.marketplacemargin"
            adb shell uiautomator dump /sdcard/fmcg-window.xml
            adb pull /sdcard/fmcg-window.xml /tmp/fmcg-window.xml
            grep -Eiq "FMCG by Alex|Marketplace Margin Calculator" /tmp/fmcg-window.xml
            if adb logcat -d | grep -E "FATAL EXCEPTION|AndroidRuntime.*FATAL" | grep -qi "fmcgbyalex"; then
              echo "Fatal FMCG app runtime error detected"
              exit 1
            fi
      - name: Stage APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/FMCG-by-Alex-Marketplace-Margin-Calculator-Android.apk
          sha256sum ../out/FMCG-by-Alex-Marketplace-Margin-Calculator-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fmcg-margin-android
          path: apps/marketplace-margin-calculator/out/FMCG-by-Alex-Marketplace-Margin-Calculator-Android.apk
          if-no-files-found: error
