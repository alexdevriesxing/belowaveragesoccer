name: FMCG Cloudflare credential availability

on:
  push:
    branches:
      - ci/fmcg-marketplace-build
    paths:
      - ".github/workflows/fmcg-cloudflare-credential-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare deploy credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not available to this repository"; exit 21; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not available to this repository"; exit 22; }
          echo "Cloudflare credentials are available to this repository."
